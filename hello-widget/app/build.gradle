plugins { id 'com.android.application' }

android {
    namespace 'com.hello.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hello.widget'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
